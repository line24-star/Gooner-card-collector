# ---------------------------------------------------------------- RTP targets (§6)
# RTP = (expected organizing value of the pulls + duplicate coins) / pack cost.
# Organizing value assumes you tag what you pull (assumed_tags_per_card tags each).
[rtp]
assumed_tags_per_card = 2       # player behavior assumption used for the estimate
early_target = [2.00, 2.30]     # a Standard pack in a fresh library (tests/test_packs_roll.py). v0.9.0: was
                                # 0.70 to 0.85. Tagging now pays for the packs, so the return is above 1
                                # for a player who tags what the pack holds (measured: 2.16 with two tags a card)
