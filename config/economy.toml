# ---------------------------------------------------------------- mastery (v0.6.0)
# A second progress number that keeps rising in a finished library (game/mastery.py).
# points = every owned card counts by its best treatment, plus `fuse_points` per fuse ever done.
# Level L is reached at round(level_base × L ^ level_exponent) points: 10, 30, 58, 92, 131, ... so
# the levels get further apart. Each level pays once, when the player claims it (see `reward` below).
# Selling a card can lower the points; a level that was paid is never paid again.
# v0.6.0 audit (tools.simulate --audit): the first numbers (Normal 1 / Foil 3 / Holo 8 / Special 20,
# 40 + 10 × L coins up to 300) paid most while the library was still being pulled (a point per new
# card: 30% of a casual first day, and a first day without a time limit grew from 310 to over 530
# minutes) and only 25-30 coins a day in a finished library. So a Normal card counts nothing: mastery
# rises only with rarer treatments and with fuses, which is what the late game is made of. The steps
# of the late game (Normal to Foil, Foil to Holo) are worth more, the early levels pay less.
[mastery]
points = { normal = 0, foil = 4, holo = 12, special = 30 }
fuse_points = 2
level_base = 10
level_exponent = 1.6
# v0.9.0: a level pays 1 Standard pack; every 5th level a Deluxe instead, every 10th a Premium.
# (Before: 20 + 12 x L coins, up to 400.)
reward = { pack = "standard", count = 1 }
reward_every = [{ every = 5, pack = "deluxe" }, { every = 10, pack = "premium" }]

# Category sets: every tag with at least `min_size` cards is a set. Owning all of its cards
# at a treatment (or better) completes the set at that treatment, once each.
# v0.9.0: the reward is packs by treatment, twice as many for a set of `large_size` cards or more.
# A set pays only while more than half of its cards have not counted for a set at that treatment
# before, so a second tag on the same cards pays nothing. (Before: 50 to 150 coins by size, times
# the treatment's multiplier, scaled by the share of cards that had not counted.)
[sets]
min_size = 5
treatments = ["foil", "holo", "special"]
large_size = 15
[sets.rewards]
foil = { pack = "standard", count = 1 }
holo = { pack = "deluxe", count = 1 }
special = { pack = "premium", count = 1 }

[rarity_decay]                  # packs get less shiny as completeness rises (§6)
max = 0.0                       # v0.9.0 (decision D4): off, the odds are the same for every pack. Was 0.30
                                # (at 100% completeness the non-Normal weights were × 0.70)

# Request limits for the organizing endpoints (tagging, review, bulk).
[limits]
organize_per_second = 5         # sustained requests per second
organize_burst = 30             # short bursts allowed above that
bulk_max_items = 200            # most cards one bulk-tag call may touch

# ---------------------------------------------------------------- onboarding
# The "Getting started" checklist and the tours. v0.9.0: packs instead of coins, three Standard
# packs in all: one for tagging the first five cards, one for the first fuse, one when every tour
# is finished (not skipped). The other steps are steps only. (Before: 155 coins + 10 a tour.)
[onboarding]
tours = ["welcome", "organize", "packs", "card-panel", "market"]   # only these ids count (not "setup")
tours_reward = { pack = "standard", count = 1 }

[[onboarding.steps]]
id = "add-media"
title = "Add your photos and videos"
