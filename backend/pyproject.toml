[project]
name = "media-organizer-backend"
version = "0.9.0"  # keep in sync with /version.json
description = "Backend for the gamified media collection organizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "watchdog>=5.0",
    "pillow>=11.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "price_steps: keeps the live fuse.price_steps (other tests fuse at the base count)",
    "upgrades_on: runs with upgrade attempts switched on (they are off in the live config since v0.7.1)",
]

[tool.ruff]
line-length = 100
